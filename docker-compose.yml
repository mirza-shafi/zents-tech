services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # target: runner  # uncomment to build only up to the runner stage
    image: zents-tech:latest
    container_name: zents-tech-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

